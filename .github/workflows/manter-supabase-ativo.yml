# Acorda o Supabase de 3 em 3 dias para o plano grátis não o pausar
# (o Supabase pausa projetos grátis ao fim de 7 dias sem uso).
name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 9 */3 * *'   # às 09:00 UTC, de 3 em 3 dias
  workflow_dispatch:         # permite correr à mão no separador Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer um pedido à base de dados
        run: |
          curl -sS -o /dev/null -w "Supabase respondeu: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/services?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
